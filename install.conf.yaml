- defaults:
    link:
      force: true
      relink: true
      create: true
    shell:
      stderr: true
      stdin: true

- clean: ['~', '~/.config', '~/.tmux']

- link:
    ~/.zshrc: zsh/zshrc
    ~/.ideavimrc: nvim/ideavimrc
    ~/.config/nvim/init.vim: nvim/vimrc
    ~/.gitignore: git/.gitignore
    ~/.gitconfig: git/.gitconfig
    ~/.gitconfig-sap: git/.gitconfig-sap
    ~/.tmux.conf: tmux/tmux.conf
    ~/.tmux/plugins/tpm: tmux/tpm

- shell:
  - command: git submodule update --init --recursive
    description: Installing submodules
  - command: |
      export PATH="/opt/homebrew/bin:/home/linuxbrew/.linuxbrew/bin:$PATH"
      if ! command -v brew >/dev/null 2>&1; then
        echo "Homebrew not found, installing..."
        NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)" \
          || { echo "ERROR: Homebrew installation failed" >&2; exit 1; }
      fi
      command -v brew >/dev/null 2>&1 || { echo "ERROR: Homebrew is required but is not available" >&2; exit 1; }
      brew bundle --file="$PWD/homebrew/Brewfile"
      echo ""
      echo "To install optional desktop dependencies run:"
      echo "  brew bundle --file=\"$PWD/homebrew/Brewfile.desktop\""
    description: Installing Homebrew and dependencies
  - command: if [ "$(uname -s)" = "Darwin" ]; then DOTFILES="$PWD" . "$PWD/macos/defaults.sh"; fi
    description: Applying macOS preferences
